name: Finite-S3 fourteen-direction branch-aware pulse search

on:
  pull_request:
    paths:
      - colour_s3_branch_aware_optimizer.py
      - test_colour_s3_branch_aware_optimizer.py
      - COLOUR_S3_BRANCH_AWARE_OPTIMIZER_AUDIT.md
      - .github/workflows/colour_s3_branch_aware_optimizer.yml
  workflow_dispatch:

jobs:
  branch-aware-pulse-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact group and numerical optimizer libraries
        run: python -m pip install numpy scipy sympy
      - name: Verify controls, branch gradients and independent 14D certificate
        run: python -m unittest -v test_colour_s3_branch_aware_optimizer
      - name: Run bounded AS and BS searches at 13 and 26 controls
        run: python colour_s3_branch_aware_optimizer.py
      - name: Preserve measured objective, pulse angles, branch and cost diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-s3-branch-aware-search
          path: colour_s3_branch_aware_results.json
          if-no-files-found: ignore
