name: Research smoke checks

on:
  pull_request:
  push:
    branches:
      - main
      - research/su2-sk1-composite-pulse

jobs:
  exact-math:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact one-Higgs Yukawa enumeration (stdlib)
        run: python exact_yukawa.py
      - name: Install numerical dependency
        run: python -m pip install numpy==2.3.3
      - name: Coupled code fingerprint checks
        run: python code_fingerprints.py --extended
      - name: Four-site local-unitary purity invariants
        run: python local_purity.py
      - name: External published qutrit matrices and same-length comparison
        run: python published_qutrit_family.py
      - name: Reed-Muller published-family obstruction
        run: python reed_muller_family_exclusion.py
      - name: E8 chirality obstruction as a code obstruction
        run: python e8_comparison.py
      - name: Walsh-character rigidity and explicit disguised direct sums
        run: python walsh_character_lattice.py
      - name: Operational gauge simulator, Gauss limitation and toric KL recovery
        run: python operational_gauge_qec.py
      - name: Abstract charge-lattice full Pauli KL certificate
        run: python abstract_stabilizer_recovery.py
      - name: Install exact SU2 representation dependency
        run: python -m pip install sympy==1.14.0
      - name: SU2 matter doublets and non-Abelian Gauss-only KL counterexample
        run: python su2_matter_singlet.py
      - name: Four-link matter singlet subspace and exchange-error KL test
        run: python four_link_su2_subspace.py
      - name: Four-link SU2 collective exchange and complete local noise-algebra no-go
        run: python su2_exchange_algebra.py
      - name: Five SU2 singlet blocks and exact 5-qubit recovery (1024 KL overlaps)
        run: python five_block_su2_recovery.py
      - name: Exact single-fault propagation for bare and flagged SU2 stabilizer gadgets
        run: python flagged_su2_measurement.py
      - name: Two measured flagged rounds and adaptive third under all single faults
        run: python measured_multiround_su2.py --stress
      - name: Published-style adaptive five-qubit flag EC and one-fault criteria audit
        run: python paper_style_flag_ec.py --stress
      - name: SU2 ancilla-conditioned local exchanges and controlled Clifford signatures
        run: python su2_controlled_exchange.py
      - name: Published Chao-Reichardt Figure 2(d) flagged error catalog
        run: python published_flag_figure2_catalog.py
      - name: SU2 two-body singlet mediator, exact SW and full 256-state dynamics
        run: OPENBLAS_NUM_THREADS=1 python two_body_su2_mediator.py
      - name: Install deterministic pulse-control numerical solver
        run: python -m pip install scipy==1.17.0
      - name: SU2 smooth-pulse optimization, 1024-bin convergence and full-spin crosscheck
        run: OPENBLAS_NUM_THREADS=1 python su2_shaped_pulse.py
      - name: SK1-style composite SU2 gate robustness, both couplers and 256-state crosscheck
        run: OPENBLAS_NUM_THREADS=1 python su2_sk1_composite_pulse.py
