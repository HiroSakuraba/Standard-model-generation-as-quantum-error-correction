name: Finite-S3 complete three-outcome instrument certification

on:
  pull_request:
    paths:
      - colour_s3_instrument_certificate.py
      - test_colour_s3_instrument_certificate.py
      - COLOUR_S3_INSTRUMENT_CERTIFICATE_AUDIT.md
      - .github/workflows/colour_s3_instrument_certificate.yml
  workflow_dispatch:

jobs:
  instrument-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical and group-model dependencies
        run: python -m pip install numpy scipy sympy
      - name: Regress all 14 input directions and ordered faults
        run: python -m unittest -v test_colour_s3_instrument_certificate
      - name: Print explicit no-gate and uncompiled-ideal control results
        run: python colour_s3_instrument_certificate.py
