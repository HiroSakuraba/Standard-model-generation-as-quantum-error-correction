name: Finite-S3 direct logical channel recovery pulse optimizer

on:
  pull_request:
    paths:
      - colour_s3_direct_logical_compiler.py
      - test_colour_s3_direct_logical_compiler.py
      - COLOUR_S3_DIRECT_LOGICAL_COMPILER_AUDIT.md
      - .github/workflows/colour_s3_direct_logical_compiler.yml
  workflow_dispatch:

jobs:
  optimize-logical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical and exact group-model dependencies
        run: python -m pip install numpy scipy sympy
      - name: Verify unconditional channel gradient and identity baseline
        run: python -m unittest -v test_colour_s3_direct_logical_compiler
      - name: Train direct seven-error logical channel at 13, 26, 52, 104 controls
        run: python colour_s3_direct_logical_compiler.py
      - name: Archive direct logical fidelity, pulse angles and native cost ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-s3-direct-logical-fidelity-pulse-optimizer
          path: colour_s3_direct_logical_compiler_results.json
          if-no-files-found: ignore
