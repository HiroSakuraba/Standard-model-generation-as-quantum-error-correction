name: Research smoke checks

on:
  pull_request:
  push:
    branches:
      - main
      - research/su2-exchange-algebra

jobs:
  exact-math:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact one-Higgs Yukawa enumeration (stdlib)
        run: python exact_yukawa.py
      - name: Install numerical dependency
        run: python -m pip install numpy==2.3.3
      - name: Coupled code fingerprint checks
        run: python code_fingerprints.py --extended
      - name: Four-site local-unitary purity invariants
        run: python local_purity.py
      - name: External published qutrit matrices and same-length comparison
        run: python published_qutrit_family.py
      - name: Reed-Muller published-family obstruction
        run: python reed_muller_family_exclusion.py
      - name: Walsh-character rigidity and explicit disguised direct sums
        run: python walsh_character_lattice.py
      - name: Operational gauge simulator, Gauss limitation and toric KL recovery
        run: python operational_gauge_qec.py
      - name: Abstract charge-lattice full Pauli KL certificate
        run: python abstract_stabilizer_recovery.py
      - name: Install exact SU2 representation dependency
        run: python -m pip install sympy==1.14.0
      - name: SU2 matter doublets and non-Abelian Gauss-only KL counterexample
        run: python su2_matter_singlet.py
      - name: Four-link matter singlet subspace and exchange-error KL test
        run: python four_link_su2_subspace.py
      - name: Four-link SU2 collective exchange and complete local noise-algebra no-go
        run: python su2_exchange_algebra.py
