name: S3 finite 42D recovery target numerical pulse compiler

on:
  pull_request:
    paths:
      - colour_s3_recovery_pulse_compiler.py
      - test_colour_s3_recovery_pulse_compiler.py
      - COLOUR_S3_RECOVERY_PULSE_COMPILER_AUDIT.md
      - .github/workflows/colour_s3_recovery_pulse_compiler.yml
  workflow_dispatch:

jobs:
  compile-recovery-pulses:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact algebra and numerical optimizer packages
        run: python -m pip install numpy scipy sympy
      - name: Verify analytic gradients, three-outcome target and charged-bus native cost ledger
        run: python -m unittest -v test_colour_s3_recovery_pulse_compiler
      - name: Optimize both six-exchange-group recovery targets at 13, 26 and 52 pulse depths
        run: python colour_s3_recovery_pulse_compiler.py
      - name: Upload actual angle schedules, pointer outcomes, depth-vs-fidelity and resource estimates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-s3-42D-pulse-compiler-benchmark
          path: colour_s3_recovery_pulse_compiler_results.json
          if-no-files-found: ignore
