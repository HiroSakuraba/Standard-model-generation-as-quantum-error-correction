name: S3 gauge-admissible passive memory same dressed error and bath

on:
  pull_request:
    paths:
      - colour_s3_gauge_admissible_passive.py
      - test_colour_s3_gauge_admissible_passive.py
      - COLOUR_S3_GAUGE_ADMISSIBLE_PASSIVE_AUDIT.md
      - .github/workflows/colour_s3_gauge_admissible_passive.yml
  workflow_dispatch:

jobs:
  verify-passive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical prerequisites
        run: python -m pip install numpy scipy
      - name: Regress common Gauss code, same dressed-swap channel, equal-fermion noise
        run: python -m unittest -v test_colour_s3_gauge_admissible_passive
      - name: Recompute full microscopic active versus exact passive comparison
        run: python colour_s3_gauge_admissible_passive.py
      - name: Archive all exact passive and sampled active research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-s3-gauge-admissible-passive-memory
          path: colour_s3_gauge_admissible_passive_results.json
          if-no-files-found: ignore
