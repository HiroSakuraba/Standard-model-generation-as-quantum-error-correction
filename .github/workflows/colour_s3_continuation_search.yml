name: Finite-S3 13 to 104 pulse sector/coherence continuation

on:
  pull_request:
    paths:
      - colour_s3_continuation_search.py
      - test_colour_s3_continuation_search.py
      - COLOUR_S3_CONTINUATION_SEARCH_AUDIT.md
      - .github/workflows/colour_s3_continuation_search.yml
  workflow_dispatch:

jobs:
  sector-coherent-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact group and bounded numerical solver dependencies
        run: python -m pip install numpy scipy sympy
      - name: Verify sector-capture gradient and non-regressing continuation
        run: python -m unittest -v test_colour_s3_continuation_search
      - name: Search AS and BS at 13, 26, 52, 104 controls
        run: python colour_s3_continuation_search.py
      - name: Archive selected pulse angles, independent certificates and cost diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-s3-depth-continuation
          path: colour_s3_continuation_results.json
          if-no-files-found: ignore
